    <!-- Apply theme before paint to avoid a flash (landing defaults light, app dark). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sake_theme')
          var h = location.hash
          var landing = h === '' || h === '#' || h === '#/'
          var light = t === 'light' || t === 'dark' ? t === 'light' : landing
          if (light) document.documentElement.classList.add('theme-light')
        } catch (e) {}
      })()
    </script>
